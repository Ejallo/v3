name: Deploy

# Every push to main goes live on vvdigital.de (Cloudflare Pages).
# The old GitHub Pages copy (ejallo.github.io/v3) only redirects there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      # Repository secrets: a token with only "Cloudflare Pages: Edit", and the account id.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Until the secrets exist the site is deployed by hand (wrangler pages deploy); this job then just skips.
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets: skipping the deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable it."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npx astro build
      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name=vvdigital --branch=main --commit-hash=${{ github.sha }}

  github-pages-redirect:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect pages
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://vvdigital.de/">
          <meta http-equiv="refresh" content="0; url=https://vvdigital.de/">
          <title>VVdigital</title>
          <script>location.replace("https://vvdigital.de" + location.pathname.replace(/^\/v3/, "") + location.search + location.hash)</script>
          </head>
          <body><a href="https://vvdigital.de/">vvdigital.de</a></body>
          </html>
          EOF
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
